name: Supabase Keep-Alive

on:
  schedule:
    # Every 2 days at 03:00 UTC. GitHub Actions cron is POSIX-based and the
    # day-of-month step resets at each month boundary, so the real-world gap
    # can occasionally stretch to ~3 days there — still comfortably under
    # Supabase's 7-day pause threshold.
    - cron: "0 3 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Create, read, then delete a keep-alive row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "[Supabase Keep-Alive] FAILED: missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          AUTH_HEADERS=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          # 1) CREATE — insert a row into the hidden _keepalive_pings table
          #    (RLS-locked, no policies, so the public anon key can never see
          #    it — this table is invisible to the live site).
          CREATE_CODE=$(curl -s -o /tmp/keepalive_create.json -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/_keepalive_pings" \
            "${AUTH_HEADERS[@]}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}')

          if [ "$CREATE_CODE" -lt 200 ] || [ "$CREATE_CODE" -ge 300 ]; then
            echo "[Supabase Keep-Alive] FAILED at ${TIMESTAMP}: insert returned HTTP ${CREATE_CODE}"
            cat /tmp/keepalive_create.json
            exit 1
          fi

          ROW_ID=$(sed -n 's/.*"id"\s*:\s*"\([^"]*\)".*/\1/p' /tmp/keepalive_create.json | head -n1)
          if [ -z "$ROW_ID" ]; then
            echo "[Supabase Keep-Alive] FAILED at ${TIMESTAMP}: could not parse inserted row id"
            cat /tmp/keepalive_create.json
            exit 1
          fi

          # 2) READ — confirm the row is actually there
          READ_CODE=$(curl -s -o /tmp/keepalive_read.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/_keepalive_pings?id=eq.${ROW_ID}&select=id" \
            "${AUTH_HEADERS[@]}")

          if [ "$READ_CODE" -lt 200 ] || [ "$READ_CODE" -ge 300 ]; then
            echo "[Supabase Keep-Alive] FAILED at ${TIMESTAMP}: read-back returned HTTP ${READ_CODE}"
            cat /tmp/keepalive_read.json
            exit 1
          fi

          # 3) DELETE — clean up immediately so the table never accumulates rows
          DELETE_CODE=$(curl -s -o /tmp/keepalive_delete.json -w "%{http_code}" \
            -X DELETE "${SUPABASE_URL}/rest/v1/_keepalive_pings?id=eq.${ROW_ID}" \
            "${AUTH_HEADERS[@]}")

          if [ "$DELETE_CODE" -lt 200 ] || [ "$DELETE_CODE" -ge 300 ]; then
            echo "[Supabase Keep-Alive] FAILED at ${TIMESTAMP}: delete returned HTTP ${DELETE_CODE}"
            cat /tmp/keepalive_delete.json
            exit 1
          fi

          echo "[Supabase Keep-Alive] Ping successful at ${TIMESTAMP} (created, read, deleted row ${ROW_ID})"

      - name: Record result in CMS
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null -X POST "${SUPABASE_URL}/rest/v1/ci_check_runs" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"workflow\":\"Supabase Keep-Alive\",\"status\":\"${STATUS}\",\"run_url\":\"${RUN_URL}\"}"
